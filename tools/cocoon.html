<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信息茧房可视化 · 觉屏</title>
<link rel="stylesheet" href="../style.css">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
#canvas { width: 100%; height: 500px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; margin: 1.5rem 0; }
.node { stroke: #1a1918; stroke-width: 2px; cursor: pointer; }
.node:hover { stroke: var(--gold); stroke-width: 3px; }
.link { stroke: #444; stroke-opacity: 0.6; }
.label { font-size: 11px; fill: var(--text); pointer-events: none; }
.tooltip { position: absolute; padding: 0.8rem; background: #1a1918; border: 1px solid var(--gold); border-radius: 4px; font-size: 0.8rem; color: var(--text); pointer-events: none; opacity: 0; transition: opacity 0.2s; max-width: 250px; line-height: 1.6; }
.controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
.controls button { font-size: 0.75rem; padding: 0.3rem 0.8rem; }
.legend { display: flex; gap: 1rem; margin: 1rem 0; font-size: 0.8rem; color: var(--dim); }
.legend-item { display: flex; align-items: center; gap: 0.3rem; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
</style>
</head>
<body>
<a class="back" href="../index.html">← 返回觉屏</a>
<h1>信 息 茧 房 可 视 化</h1>
<p class="tip">你的信息世界长什么样？每个节点是一条记录，连线是算法推荐链。数据来自你的摄入追踪。</p>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#6b8e5a;"></div>平静</div>
  <div class="legend-item"><div class="legend-dot" style="background:#888;"></div>中性</div>
  <div class="legend-item"><div class="legend-dot" style="background:#d4a853;"></div>好奇</div>
  <div class="legend-item"><div class="legend-dot" style="background:#c05050;"></div>愤怒/焦虑</div>
  <div class="legend-item"><div class="legend-dot" style="background:#a050c0;"></div>被操纵</div>
</div>

<div class="controls">
  <button onclick="loadData()">从追踪记录加载</button>
  <button onclick="generateDemo()">生成演示数据</button>
  <button onclick="clearGraph()">清空</button>
</div>

<div id="canvas"></div>
<div class="tooltip" id="tooltip"></div>

<script>
const colorMap = { calm: '#6b8e5a', neutral: '#888', curious: '#d4a853', angry: '#c05050', anxious: '#c05050', manipulated: '#a050c0' };
let simulation, svg, width, height;

function initCanvas() {
  d3.select('#canvas').selectAll('*').remove();
  const rect = document.getElementById('canvas').getBoundingClientRect();
  width = rect.width; height = rect.height;
  svg = d3.select('#canvas').append('svg').attr('width', width).attr('height', height);
}

function drawGraph(nodes, links) {
  initCanvas();
  const tooltip = document.getElementById('tooltip');

  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(120))
    .force('charge', d3.forceManyBody().strength(-300))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(25));

  const link = svg.append('g').selectAll('line')
    .data(links).enter().append('line')
    .attr('class', 'link');

  const node = svg.append('g').selectAll('circle')
    .data(nodes).enter().append('circle')
    .attr('class', 'node')
    .attr('r', d => d.weight || 12)
    .attr('fill', d => colorMap[d.impact] || '#888')
    .call(d3.drag()
      .on('start', dragstart)
      .on('drag', dragged)
      .on('end', dragend));

  const label = svg.append('g').selectAll('text')
    .data(nodes).enter().append('text')
    .attr('class', 'label')
    .text(d => d.source ? d.source.substring(0, 6) : '?')
    .attr('text-anchor', 'middle')
    .attr('dy', 3);

  node.on('mouseover', (e, d) => {
    tooltip.style.opacity = 1;
    tooltip.innerHTML = `<strong>${d.source}</strong><br>影响：${d.impact}<br>时长：${d.duration || 0}分钟`;
    tooltip.style.left = e.pageX + 10 + 'px';
    tooltip.style.top = e.pageY - 10 + 'px';
  }).on('mouseout', () => { tooltip.style.opacity = 0; });

  simulation.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('cx', d => d.x).attr('cy', d => d.y);
    label.attr('x', d => d.x).attr('y', d => d.y);
  });
}

function dragstart(e, d) { if (!simulation.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragend(e, d) { if (!simulation.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

function loadData() {
  const entries = JSON.parse(localStorage.getItem('puti_intake') || '[]');
  if (entries.length === 0) { alert('没有追踪记录，先去"信息摄入追踪"页面添加一些记录吧。'); return; }
  const nodes = entries.map((e, i) => ({ id: i, source: e.source, impact: e.impact, duration: e.duration, weight: Math.max(10, (e.duration || 5) / 3) }));
  const links = [];
  for (let i = 1; i < nodes.length; i++) links.push({ source: i - 1, target: i });
  drawGraph(nodes, links);
}

function generateDemo() {
  const demos = [
    { id: 0, source: '微博热搜', impact: 'angry', duration: 30, weight: 15 },
    { id: 1, source: '相关争议视频', impact: 'angry', duration: 20, weight: 12 },
    { id: 2, source: '评论区骂战', impact: 'manipulated', duration: 15, weight: 18 },
    { id: 3, source: '算法推荐同类', impact: 'anxious', duration: 25, weight: 14 },
    { id: 4, source: '搞笑视频', impact: 'neutral', duration: 10, weight: 10 },
    { id: 5, source: '深度文章', impact: 'curious', duration: 15, weight: 12 },
    { id: 6, source: '冥想音乐', impact: 'calm', duration: 20, weight: 10 },
  ];
  const links = [{ source: 0, target: 1 }, { source: 1, target: 2 }, { source: 2, target: 3 }, { source: 3, target: 4 }, { source: 4, target: 5 }, { source: 5, target: 6 }];
  drawGraph(demos, links);
}

function clearGraph() { initCanvas(); }

// 自动生成演示
generateDemo();
</script>
</body>
</html>

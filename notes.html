<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>觉屏 · 记录</title>
<style>
body {
  background: #0a0a0a;
  color: #e0e0e0;
  font-family: -apple-system, "PingFang SC", sans-serif;
  max-width: 600px;
  margin: 2rem auto;
  padding: 1rem;
  line-height: 1.8;
}
h1 {
  color: #c9a96e;
  font-weight: 300;
  letter-spacing: 0.2em;
  font-size: 1.3rem;
}
p { color: #555; font-size: 0.85rem; margin-bottom: 1.5rem; }
input {
  width: 100%;
  padding: 0.7rem;
  background: #111;
  border: 1px solid #222;
  color: #e0e0e0;
  border-radius: 4px;
  font-size: 0.9rem;
  margin-bottom: 0.8rem;
}
button {
  background: transparent;
  border: 1px solid #c9a96e;
  color: #c9a96e;
  padding: 0.4rem 1.2rem;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.85rem;
}
button:hover { background: #c9a96e; color: #000; }
li {
  margin: 0.8rem 0;
  padding: 0.8rem;
  background: #111;
  border-left: 2px solid #c9a96e;
  list-style: none;
  font-size: 0.9rem;
}
time { color: #444; font-size: 0.75rem; }
</style>
</head>
<body>

<h1>觉 屏 · 记 录</h1>
<p>写在这里的内容只存在你自己的浏览器里，刷新不丢，关掉再开也还在。</p>

<input id="input" placeholder="写下你此刻的觉察...">
<button onclick="add()">记录</button>
<ul id="list"></ul>

<script>
let items = JSON.parse(localStorage.getItem('puti_notes') || '[]');
render();

function add() {
  const val = input.value.trim();
  if (!val) return;
  items.unshift({ text: val, time: new Date().toLocaleString() });
  localStorage.setItem('puti_notes', JSON.stringify(items));
  input.value = '';
  render();
}

function render() {
  list.innerHTML = items.map(i =>
    `<li><time>${i.time}</time><br>${i.text}</li>`
  ).join('');
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
body{width:380px;padding:1rem;background:#0a0a0a;color:#e0e0e0;font-family:-apple-system,"PingFang SC",sans-serif;margin:0;}
h2{color:#c9a96e;font-weight:300;letter-spacing:0.2em;font-size:1rem;margin-bottom:0.5rem;}
textarea{width:100%;height:100px;background:#111;border:1px solid #222;color:#e0e0e0;padding:0.5rem;border-radius:4px;font-size:0.85rem;resize:vertical;box-sizing:border-box;}
button{width:100%;margin-top:0.5rem;background:transparent;border:1px solid #c9a96e;color:#c9a96e;padding:0.5rem;border-radius:4px;cursor:pointer;font-size:0.85rem;}
button:hover{background:#c9a96e;color:#000;}
.result{padding:0.8rem;margin-top:0.8rem;background:#111;border-left:2px solid #c9a96e;font-size:0.8rem;line-height:1.6;display:none;border-radius:0 4px 4px 0;}
.tip{font-size:0.7rem;color:#666;margin-top:0.5rem;}
</style>
</head>
<body>
<h2>觉 屏 · 照 见</h2>
<p class="tip">选中网页文字 → 右键 → "觉屏 · 照见选中内容"</p>
<textarea id="input" placeholder="或在此粘贴文本..."></textarea>
<button id="analyze">照见</button>
<div class="result" id="result"></div>
<p class="tip">API Key 仅存本地浏览器。</p>
<script src="popup.js"></script>
</body>
</html>
